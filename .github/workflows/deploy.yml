name: Deploy Jike to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ./pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.NUXT_PUBLIC_API_BASE }}
          NUXT_PUBLIC_GITALK_CLIENT_ID: ${{ secrets.NUXT_PUBLIC_GITALK_CLIENT_ID }}
          NUXT_PUBLIC_GITALK_CLIENT_SECRET: ${{ secrets.NUXT_PUBLIC_GITALK_CLIENT_SECRET }}
          NUXT_PUBLIC_GITALK_REPO: ${{ vars.NUXT_PUBLIC_GITALK_REPO }}
          NUXT_PUBLIC_GITALK_OWNER: ${{ vars.NUXT_PUBLIC_GITALK_OWNER }}
          NUXT_PUBLIC_GITALK_ADMIN: ${{ vars.NUXT_PUBLIC_GITALK_ADMIN }}
          NUXT_PUBLIC_GITALK_PROXY: ${{ vars.NUXT_PUBLIC_GITALK_PROXY }}
          NUXT_PUBLIC_GITALK_GH_TOKEN: ${{ secrets.NUXT_PUBLIC_GITALK_GH_TOKEN }}
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          directory: ./dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
